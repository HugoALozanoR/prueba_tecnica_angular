<div class="layout">
  <header class="layout__header">
    <h1 class="layout__title">GymReservas</h1>
  </header>

  <main class="layout__main" [class.layout__main--split]="selectedBooking()">
    <section class="layout__list">
      <app-booking-list />
    </section>

    @if (selectedBooking()) {
      <aside class="layout__detail">
        <app-booking-detail />
      </aside>
    }
  </main>

  <footer class="layout__footer">
    <p>© 2025 GymReservas — Todos los derechos reservados</p>
  </footer>
</div>
